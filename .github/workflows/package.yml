name: Packages

on:
  # push:
  #   branches: [ main, test, staging ]
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows MSI packages
        required: true
        type: boolean
        default: true
      build_linux:
        description: Build Linux DEB/RPM packages
        required: true
        type: boolean
        default: true
      build_macos:
        description: Build unsigned macOS PKG packages
        required: true
        type: boolean
        default: true
      configuration:
        description: Build configuration
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: Release

env:
  RestoreLockedMode: 'true'

jobs:
  windows-msi:
    name: Windows Installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            expected_arch: X64
          - arch: arm64
            runner: windows-11-arm
            expected_arch: Arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore installer project
      run: dotnet restore ColDogLocker.Installer.Windows/ColDogLocker.Installer.Windows.wixproj

    - name: Run native service tests
      run: dotnet test ColDogLocker.Services.Tests/ColDogLocker.Services.Tests.csproj --configuration "${{ inputs.configuration || 'Release' }}" --verbosity normal

    - name: Build upgrade baseline MSI and setup EXE
      run: |
        dotnet build ColDogLocker.Installer.Windows/ColDogLocker.Installer.Windows.wixproj -c "${{ inputs.configuration || 'Release' }}" -p:PackageArchitecture=${{ matrix.arch }} -p:Version=0.0.1 --no-restore
        Move-Item "artifacts/packages/dist/ColDogLocker-0.0.1-win-${{ matrix.arch }}.msi" "$env:RUNNER_TEMP\ColDogLocker-baseline.msi"
        Move-Item "artifacts/packages/dist/ColDogLocker-0.0.1-win-${{ matrix.arch }}-setup.exe" "$env:RUNNER_TEMP\ColDogLocker-baseline-setup.exe"

    - name: Build MSI and setup EXE
      run: dotnet build ColDogLocker.Installer.Windows/ColDogLocker.Installer.Windows.wixproj -c "${{ inputs.configuration || 'Release' }}" -p:PackageArchitecture=${{ matrix.arch }} --no-restore

    - name: Validate installed Windows package
      shell: pwsh
      run: |
        $msi = @(Get-ChildItem "artifacts/packages/dist/ColDogLocker-*-win-${{ matrix.arch }}.msi")
        $setup = @(Get-ChildItem "artifacts/packages/dist/ColDogLocker-*-win-${{ matrix.arch }}-setup.exe")
        if ($msi.Count -ne 1 -or $setup.Count -ne 1) { throw "Expected exactly one MSI and setup EXE." }
        .github/scripts/windows_installed_e2e.ps1 -MsiPath $msi[0].FullName -SetupPath $setup[0].FullName -BaselineMsiPath "$env:RUNNER_TEMP\ColDogLocker-baseline.msi" -BaselineSetupPath "$env:RUNNER_TEMP\ColDogLocker-baseline-setup.exe" -ReviewScripts ".github/scripts" -ExpectedArchitecture "${{ matrix.expected_arch }}"

    - name: Upload Windows packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: package-win-${{ matrix.arch }}
        path: |
          artifacts/packages/dist/ColDogLocker-*-win-${{ matrix.arch }}.msi
          artifacts/packages/dist/ColDogLocker-*-win-${{ matrix.arch }}-setup.exe
        if-no-files-found: error

  linux-deb:
    name: Linux DEB (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Install package tools
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils tar gzip

    - name: Build DEB
      run: dotnet msbuild ColDogLocker.Installer.Linux/ColDogLocker.Installer.Linux.proj -t:Build -p:PackageFormat=deb -p:PackageArchitecture=${{ matrix.arch }} -p:Configuration="${{ inputs.configuration || 'Release' }}"

    - name: Verify reproducible DEB (${{ matrix.arch }})
      shell: bash
      run: |
        package=(artifacts/packages/dist/ColDogLocker-*-linux-${{ matrix.arch }}.deb)
        [ "${#package[@]}" -eq 1 ]
        cp "${package[0]}" "${RUNNER_TEMP}/first.deb"
        dotnet msbuild ColDogLocker.Installer.Linux/ColDogLocker.Installer.Linux.proj -t:Build -p:PackageFormat=deb -p:PackageArchitecture=${{ matrix.arch }} -p:Configuration="${{ inputs.configuration || 'Release' }}"
        cmp "${RUNNER_TEMP}/first.deb" "${package[0]}"

    - name: Validate installed DEB (${{ matrix.arch }})
      run: >-
        docker run --rm
        -v "${{ github.workspace }}/artifacts/packages/dist:/packages:ro"
        -v "${{ github.workspace }}/.github/scripts:/review-scripts:ro"
        ubuntu:24.04 bash /review-scripts/linux_installed_e2e.sh deb ${{ matrix.arch }}

    - name: Upload DEB
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: package-linux-${{ matrix.arch }}-deb
        path: artifacts/packages/dist/ColDogLocker-*-linux-${{ matrix.arch }}.deb
        if-no-files-found: error

  linux-rpm:
    name: Linux RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Install package tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm tar gzip

    - name: Build RPM
      run: dotnet msbuild ColDogLocker.Installer.Linux/ColDogLocker.Installer.Linux.proj -t:Build -p:PackageFormat=rpm -p:PackageArchitecture=${{ matrix.arch }} -p:Configuration="${{ inputs.configuration || 'Release' }}"

    - name: Verify reproducible RPM (${{ matrix.arch }})
      shell: bash
      run: |
        package=(artifacts/packages/dist/ColDogLocker-*-linux-${{ matrix.arch }}.rpm)
        [ "${#package[@]}" -eq 1 ]
        cp "${package[0]}" "${RUNNER_TEMP}/first.rpm"
        dotnet msbuild ColDogLocker.Installer.Linux/ColDogLocker.Installer.Linux.proj -t:Build -p:PackageFormat=rpm -p:PackageArchitecture=${{ matrix.arch }} -p:Configuration="${{ inputs.configuration || 'Release' }}"
        cmp "${RUNNER_TEMP}/first.rpm" "${package[0]}"

    - name: Validate installed RPM (${{ matrix.arch }})
      run: >-
        docker run --rm
        -v "${{ github.workspace }}/artifacts/packages/dist:/packages:ro"
        -v "${{ github.workspace }}/.github/scripts:/review-scripts:ro"
        fedora:43 bash /review-scripts/linux_installed_e2e.sh rpm ${{ matrix.arch }}

    - name: Upload RPM
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: package-linux-${{ matrix.arch }}-rpm
        path: artifacts/packages/dist/ColDogLocker-*-linux-${{ matrix.arch }}.rpm
        if-no-files-found: error

  macos-pkg:
    name: macOS PKG unsigned (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Run native service tests
      run: dotnet test ColDogLocker.Services.Tests/ColDogLocker.Services.Tests.csproj --configuration "${{ inputs.configuration || 'Release' }}" --verbosity normal

    - name: Build unsigned PKG
      run: dotnet msbuild ColDogLocker.Installer.Mac/ColDogLocker.Installer.Mac.proj -t:Build -p:PackageArchitecture=${{ matrix.arch }} -p:Configuration="${{ inputs.configuration || 'Release' }}"

    - name: Validate installed macOS package
      shell: bash
      run: |
        package=(artifacts/packages/dist/ColDogLocker-*-macos-${{ matrix.arch }}.pkg)
        [ "${#package[@]}" -eq 1 ]
        bash .github/scripts/macos_installed_e2e.sh "${package[0]}" ".github/scripts" "${{ matrix.arch }}"

    - name: Upload PKG
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: package-macos-${{ matrix.arch }}-pkg
        path: artifacts/packages/dist/ColDogLocker-*-macos-${{ matrix.arch }}.pkg
        if-no-files-found: error

  package-summary:
    name: Package Summary
    runs-on: ubuntu-latest
    needs: [ windows-msi, linux-deb, linux-rpm, macos-pkg ]
    if: always()

    steps:
    - name: Overall Summary
      run: |
        echo "Windows MSI: ${{ needs.windows-msi.result }}"
        echo "Linux DEB:   ${{ needs.linux-deb.result }}"
        echo "Linux RPM:   ${{ needs.linux-rpm.result }}"
        echo "macOS PKG:   ${{ needs.macos-pkg.result }}"

        if [ "${{ needs.windows-msi.result }}" = "failure" ] || \
           [ "${{ needs.windows-msi.result }}" = "cancelled" ] || \
           [ "${{ needs.linux-deb.result }}" = "failure" ] || \
           [ "${{ needs.linux-deb.result }}" = "cancelled" ] || \
           [ "${{ needs.linux-rpm.result }}" = "failure" ] || \
           [ "${{ needs.linux-rpm.result }}" = "cancelled" ] || \
           [ "${{ needs.macos-pkg.result }}" = "failure" ] || \
           [ "${{ needs.macos-pkg.result }}" = "cancelled" ]; then
          echo "One or more package jobs failed."
          exit 1
        fi

        echo "Package jobs completed."
