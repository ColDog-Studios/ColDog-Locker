name: Tests

on:
  push:
    branches: [ main, test, dev ]
  pull_request:
    branches: [ main, test, dev ]
  workflow_dispatch:

env:
  RestoreLockedMode: 'true'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Fail on vulnerable NuGet packages
      shell: bash
      run: dotnet restore ColDogLocker.slnx -p:NuGetAudit=true -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

    - name: Verify formatting
      run: dotnet format ColDogLocker.slnx --verify-no-changes --no-restore --verbosity minimal

    - name: Verify third-party inventory
      run: python3 .github/scripts/release_manifest.py --check-only

    - name: Report vulnerable packages
      run: dotnet list ColDogLocker.slnx package --vulnerable --include-transitive

  unit-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Setup Python for process ownership check
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Check independent-process locker ownership
      run: python .github/scripts/check_operation_lease.py

    - name: Publish CLI for crash-boundary checks
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output crash-cli

    - name: Check interrupted-operation recovery boundaries
      shell: pwsh
      run: |
        python .github/scripts/check_crash_boundaries.py --cli .\crash-cli\cdlocker.exe *>&1 |
          Tee-Object -FilePath crash-boundaries-windows.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Test Results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: unit-test-results-windows
        path: |
          **/test-results.trx
          crash-boundaries-windows.log

  unit-tests-linux:
    name: Unit Tests (Linux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Setup Python for process ownership check
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Check independent-process locker ownership
      run: python .github/scripts/check_operation_lease.py

    - name: Publish CLI for crash-boundary checks
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj --configuration Release --runtime linux-x64 --self-contained true --no-restore --output crash-cli

    - name: Check interrupted-operation recovery boundaries
      run: python .github/scripts/check_crash_boundaries.py --cli ./crash-cli/cdlocker 2>&1 | tee crash-boundaries-linux.log

    - name: Upload Test Results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: unit-test-results-linux
        path: |
          **/test-results.trx
          crash-boundaries-linux.log

  unit-tests-macos:
    name: Unit Tests (macOS - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Setup Python for process ownership check
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Check independent-process locker ownership
      run: python .github/scripts/check_operation_lease.py

    - name: Publish CLI for crash-boundary checks
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj --configuration Release --runtime osx-${{ matrix.arch }} --self-contained true --no-restore --output crash-cli

    - name: Check interrupted-operation recovery boundaries
      run: python .github/scripts/check_crash_boundaries.py --cli ./crash-cli/cdlocker 2>&1 | tee crash-boundaries-macos-${{ matrix.arch }}.log

    - name: Upload Test Results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: unit-test-results-macos-${{ matrix.arch }}
        path: |
          **/test-results.trx
          crash-boundaries-macos-${{ matrix.arch }}.log

  build-cli-windows:
    name: Build CLI (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish CLI
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj -c Release -r win-x64 -o ./cli-publish

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cli-windows
        path: ./cli-publish/

  build-cli-linux:
    name: Build CLI (Linux - ${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ubuntu:24.04
          - distro: fedora
            container: fedora:43

    container: ${{ matrix.container }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install runtime prerequisites (Ubuntu)
      if: matrix.distro == 'ubuntu'
      run: |
        apt-get update
        apt-get install -y ca-certificates curl libicu-dev libssl-dev zlib1g

    - name: Install runtime prerequisites (Fedora)
      if: matrix.distro == 'fedora'
      run: dnf install -y ca-certificates curl libicu openssl-libs zlib

    - name: Set up pinned .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish CLI
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj -c Release -r linux-x64 -o ./cli-publish

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cli-linux-${{ matrix.distro }}
        path: ./cli-publish/

  build-cli-macos:
    name: Build CLI (macOS - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish CLI
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj -c Release -r osx-${{ matrix.arch }} -o ./cli-publish

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cli-macos-${{ matrix.arch }}
        path: ./cli-publish/

  cli-e2e-tests-windows:
    name: CLI E2E Tests (Windows)
    runs-on: windows-latest
    needs: [unit-tests, build-cli-windows]
    if: always()
    env:
      CLI_PATH: .\cli-publish\cdlocker.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.x'

    - name: Download CLI Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: cli-windows
        path: ./cli-publish/

    - name: Run CLI E2E Tests
      shell: pwsh
      run: |
        python .github/scripts/cli_e2e.py --cli "$env:CLI_PATH" *>&1 |
          Tee-Object -FilePath cli-e2e-windows.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload CLI E2E results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: cli-e2e-results-windows
        path: cli-e2e-windows.log

  cli-e2e-tests-linux:
    name: CLI E2E Tests (Linux - ${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: [unit-tests-linux, build-cli-linux]
    if: always()
    env:
      CLI_PATH: ./cli-publish/cdlocker
      CLI_E2E_WORK_DIR: ./cli-e2e-work
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ubuntu:latest
          - distro: fedora
            container: fedora:latest

    container: ${{ matrix.container }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Runtime Dependencies (Ubuntu)
      if: matrix.distro == 'ubuntu'
      run: |
        apt-get update
        apt-get install -y dotnet-runtime-10.0 python3

    - name: Install Runtime Dependencies (Fedora)
      if: matrix.distro == 'fedora'
      run: |
        dnf install -y dotnet-runtime-10.0 python3

    - name: Download CLI Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: cli-linux-${{ matrix.distro }}
        path: ./cli-publish/

    - name: Make CLI Executable
      run: chmod +x "$CLI_PATH"

    - name: Run CLI E2E Tests
      run: python3 .github/scripts/cli_e2e.py --cli "$CLI_PATH" --work-dir "$CLI_E2E_WORK_DIR"

  cli-e2e-tests-macos:
    name: CLI E2E Tests (macOS - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [unit-tests-macos, build-cli-macos]
    if: always()
    env:
      CLI_PATH: ./cli-publish/cdlocker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.x'

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Download CLI Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: cli-macos-${{ matrix.arch }}
        path: ./cli-publish/

    - name: Make CLI Executable
      run: chmod +x "$CLI_PATH"

    - name: Run CLI E2E Tests
      run: python3 .github/scripts/cli_e2e.py --cli "$CLI_PATH" 2>&1 | tee cli-e2e-macos-${{ matrix.arch }}.log

    - name: Upload CLI E2E results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: cli-e2e-results-macos-${{ matrix.arch }}
        path: cli-e2e-macos-${{ matrix.arch }}.log

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, unit-tests, unit-tests-linux, unit-tests-macos, cli-e2e-tests-windows, cli-e2e-tests-linux, cli-e2e-tests-macos]
    if: always()

    steps:
    - name: Overall Summary
      run: |
        echo ""
        echo "╔══════════════════════════════════════╗"
        echo "║         Overall Test Summary         ║"
        echo "╚══════════════════════════════════════╝"
        echo ""
        echo "Unit Tests (Windows): ${{ needs.unit-tests.result }}"
        echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
        echo "Unit Tests (Linux): ${{ needs.unit-tests-linux.result }}"
        echo "Unit Tests (macOS): ${{ needs.unit-tests-macos.result }}"
        echo "CLI E2E Tests (Windows): ${{ needs.cli-e2e-tests-windows.result }}"
        echo "CLI E2E Tests (Linux): ${{ needs.cli-e2e-tests-linux.result }}"
        echo "CLI E2E Tests (macOS): ${{ needs.cli-e2e-tests-macos.result }}"
        echo ""

        if [ "${{ needs.dependency-audit.result }}" != "success" ] || \
           [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.unit-tests-linux.result }}" != "success" ] || \
           [ "${{ needs.unit-tests-macos.result }}" != "success" ] || \
           [ "${{ needs.cli-e2e-tests-windows.result }}" != "success" ] || \
           [ "${{ needs.cli-e2e-tests-linux.result }}" != "success" ] || \
           [ "${{ needs.cli-e2e-tests-macos.result }}" != "success" ]; then
          echo "Some critical tests failed."
          exit 1
        fi

        echo "All critical tests passed."
