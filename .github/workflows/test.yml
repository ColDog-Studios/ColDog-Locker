name: Tests

on:
  #push:
  #  branches: [ main, test ]
  pull_request:
    branches: [ main, test, dev ]
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Fail on vulnerable NuGet packages
      shell: bash
      run: dotnet restore ColDogLocker.slnx -p:NuGetAudit=true -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

    - name: Report vulnerable packages
      run: dotnet list ColDogLocker.slnx package --vulnerable --include-transitive

  unit-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: unit-test-results-windows
        path: '**/test-results.trx'

  unit-tests-linux:
    name: Unit Tests (Linux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: unit-test-results-linux
        path: '**/test-results.trx'

  unit-tests-macos:
    name: Unit Tests (macOS - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: unit-test-results-macos-${{ matrix.arch }}
        path: '**/test-results.trx'

  build-cli-windows:
    name: Build CLI (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish CLI
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj -c Release -o ./cli-publish

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cli-windows
        path: ./cli-publish/

  build-cli-linux:
    name: Build CLI (Linux - ${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ubuntu:latest
          - distro: fedora
            container: fedora:latest

    container: ${{ matrix.container }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install .NET (Ubuntu)
      if: matrix.distro == 'ubuntu'
      run: |
        apt-get update
        apt-get install -y wget libicu-dev
        wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --channel 10.0
        echo "$HOME/.dotnet" >> $GITHUB_PATH

    - name: Install .NET (Fedora)
      if: matrix.distro == 'fedora'
      run: |
        dnf install -y dotnet-sdk-10.0

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish CLI
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj -c Release -o ./cli-publish

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cli-linux-${{ matrix.distro }}
        path: ./cli-publish/

  build-cli-macos:
    name: Build CLI (macOS - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish CLI
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj -c Release -o ./cli-publish

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cli-macos-${{ matrix.arch }}
        path: ./cli-publish/

  cli-e2e-tests-windows:
    name: CLI E2E Tests (Windows)
    runs-on: windows-latest
    needs: [unit-tests, build-cli-windows]
    if: always()
    env:
      CLI_PATH: .\cli-publish\cdlocker.exe
      CLI_E2E_WORK_DIR: .\cli-e2e-work

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Download CLI Artifact
      uses: actions/download-artifact@v8
      with:
        name: cli-windows
        path: ./cli-publish/

    - name: Run CLI E2E Tests
      run: python .github/scripts/cli_e2e.py --cli "$env:CLI_PATH" --work-dir "$env:CLI_E2E_WORK_DIR"

  cli-e2e-tests-linux:
    name: CLI E2E Tests (Linux - ${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: [unit-tests-linux, build-cli-linux]
    if: always()
    env:
      CLI_PATH: ./cli-publish/cdlocker
      CLI_E2E_WORK_DIR: ./cli-e2e-work
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ubuntu:latest
          - distro: fedora
            container: fedora:latest

    container: ${{ matrix.container }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Runtime Dependencies (Ubuntu)
      if: matrix.distro == 'ubuntu'
      run: |
        apt-get update
        apt-get install -y dotnet-runtime-10.0 python3

    - name: Install Runtime Dependencies (Fedora)
      if: matrix.distro == 'fedora'
      run: |
        dnf install -y dotnet-runtime-10.0 python3

    - name: Download CLI Artifact
      uses: actions/download-artifact@v8
      with:
        name: cli-linux-${{ matrix.distro }}
        path: ./cli-publish/

    - name: Make CLI Executable
      run: chmod +x "$CLI_PATH"

    - name: Run CLI E2E Tests
      run: python3 .github/scripts/cli_e2e.py --cli "$CLI_PATH" --work-dir "$CLI_E2E_WORK_DIR"

  cli-e2e-tests-macos:
    name: CLI E2E Tests (macOS - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [unit-tests-macos, build-cli-macos]
    if: always()
    env:
      CLI_PATH: ./cli-publish/cdlocker
      CLI_E2E_WORK_DIR: ./cli-e2e-work
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download CLI Artifact
      uses: actions/download-artifact@v8
      with:
        name: cli-macos-${{ matrix.arch }}
        path: ./cli-publish/

    - name: Make CLI Executable
      run: chmod +x "$CLI_PATH"

    - name: Run CLI E2E Tests
      run: python3 .github/scripts/cli_e2e.py --cli "$CLI_PATH" --work-dir "$CLI_E2E_WORK_DIR"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, unit-tests, unit-tests-linux, unit-tests-macos, cli-e2e-tests-windows, cli-e2e-tests-linux, cli-e2e-tests-macos]
    if: always()

    steps:
    - name: Overall Summary
      run: |
        echo ""
        echo "╔══════════════════════════════════════╗"
        echo "║         Overall Test Summary         ║"
        echo "╚══════════════════════════════════════╝"
        echo ""
        echo "Unit Tests (Windows): ${{ needs.unit-tests.result }}"
        echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
        echo "Unit Tests (Linux): ${{ needs.unit-tests-linux.result }}"
        echo "Unit Tests (macOS): ${{ needs.unit-tests-macos.result }}"
        echo "CLI E2E Tests (Windows): ${{ needs.cli-e2e-tests-windows.result }}"
        echo "CLI E2E Tests (Linux): ${{ needs.cli-e2e-tests-linux.result }}"
        echo "CLI E2E Tests (macOS): ${{ needs.cli-e2e-tests-macos.result }}"
        echo ""

        if [ "${{ needs.dependency-audit.result }}" != "success" ] || \
           [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.unit-tests-linux.result }}" != "success" ] || \
           [ "${{ needs.unit-tests-macos.result }}" != "success" ] || \
           [ "${{ needs.cli-e2e-tests-windows.result }}" != "success" ] || \
           [ "${{ needs.cli-e2e-tests-linux.result }}" != "success" ] || \
           [ "${{ needs.cli-e2e-tests-macos.result }}" != "success" ]; then
          echo "Some critical tests failed."
          exit 1
        fi

        echo "All critical tests passed."
