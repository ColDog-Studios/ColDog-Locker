name: Tests

on:
  #push:
  #  branches: [ main, test ]
  pull_request:
    branches: [ main, test, dev ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: unit-test-results
        path: '**/test-results.trx'
    
    - name: Test Summary
      if: always()
      run: |
        Write-Output "Unit Tests Completed"
        Write-Output "Check the test results artifact for details"

  cli-e2e-tests:
    name: CLI End-to-End Tests
    runs-on: windows-latest
    needs: unit-tests
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    
    - name: Build CLI
      run: dotnet publish ColDogLocker.Cli/ColDogLocker.Cli.csproj -c Release -o ./cli-publish
    
    - name: Test - Version Command
      id: test-version
      continue-on-error: true
      run: |
        Write-Output "Testing --version command..."
        $output = & ".\cli-publish\cdlocker.exe" --version
        $outputText = $output -join "`n"
        Write-Output "Output: $outputText"
        if ($outputText -notmatch "ColDog Locker") {
          throw "Version command failed - expected version info"
        }
        Write-Output "✓ Version command passed"
    
    - name: Test - Help Command
      id: test-help
      continue-on-error: true
      run: |
        Write-Output "Testing help command..."
        $output = & ".\cli-publish\cdlocker.exe" help
        $outputText = $output -join "`n"
        Write-Output "Output preview: $($output | Select-Object -First 5)"
        if ($outputText -notmatch "USAGE") {
          throw "Help command failed - expected usage information"
        }
        Write-Output "✓ Help command passed"
    
    - name: Test - List Empty Lockers
      id: test-list-empty
      continue-on-error: true
      run: |
        Write-Output "Testing list command (before creating lockers)..."
        $output = & ".\cli-publish\cdlocker.exe" list
        Write-Output "Output: $output"
        Write-Output "✓ List command passed"
    
    - name: Test - Create Locker (Automated)
      id: test-create-locker
      continue-on-error: true
      run: |
        Write-Output "Testing locker creation..."
        $testDir = Join-Path $env:TEMP "e2e-test-locker-$(New-Guid)"
        Write-Output "Creating locker at: $testDir"
        
        & ".\cli-publish\cdlocker.exe" new E2ETestLocker --path "$testDir" --password "AutomatedTest123!"
        
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to create locker (exit code: $LASTEXITCODE)"
        }
        
        # Verify directory was created
        if (!(Test-Path $testDir)) {
          throw "Locker directory was not created"
        }
        
        Write-Output "✓ Locker creation passed"
        
        # Save test dir for cleanup
        $testDir | Out-File -FilePath "test-locker-path.txt"
    
    - name: Test - Create Test Files
      id: test-create-files
      continue-on-error: true
      run: |
        Write-Output "Creating test files in locker..."
        $testDir = Get-Content "test-locker-path.txt" -ErrorAction SilentlyContinue
        if (-not $testDir) {
          Write-Output "⚠ Cannot create test files - locker path not found"
          exit 1
        }
        
        # Create test files with known content
        "Secret Content 1" | Out-File -FilePath "$testDir\file1.txt" -Encoding UTF8
        "Secret Content 2" | Out-File -FilePath "$testDir\file2.txt" -Encoding UTF8
        
        New-Item -ItemType Directory -Path "$testDir\subfolder" -Force | Out-Null
        "Secret Content 3" | Out-File -FilePath "$testDir\subfolder\file3.txt" -Encoding UTF8
        
        Write-Output "✓ Test files created"
    
    - name: Test - List Lockers
      id: test-list-lockers
      continue-on-error: true
      run: |
        Write-Output "Testing list command (after creation)..."
        $output = & ".\cli-publish\cdlocker.exe" list
        $outputText = $output -join "`n"
        Write-Output "Output: $output"
        
        if ($outputText -notmatch "E2ETestLocker") {
          throw "Created locker not found in list"
        }
        Write-Output "✓ List command shows created locker"
    
    - name: Test - Lock Locker
      id: test-lock
      continue-on-error: true
      run: |
        Write-Output "Testing lock command..."
        & ".\cli-publish\cdlocker.exe" lock E2ETestLocker --password "AutomatedTest123!"
        
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to lock locker (exit code: $LASTEXITCODE)"
        }
        
        Write-Output "✓ Lock command passed"
    
    - name: Test - Verify Locker is Locked
      id: test-verify-locked
      continue-on-error: true
      run: |
        Write-Output "Verifying locker is locked..."
        $output = & ".\cli-publish\cdlocker.exe" status E2ETestLocker
        $outputText = $output -join "`n"
        Write-Output "Status output: $output"
        
        if ($outputText -notmatch "locked|Locked") {
          throw "Locker status does not show as locked"
        }
        Write-Output "✓ Locker is locked"
    
    - name: Test - Unlock Locker
      id: test-unlock
      continue-on-error: true
      run: |
        Write-Output "Testing unlock command..."
        & ".\cli-publish\cdlocker.exe" unlock E2ETestLocker --password "AutomatedTest123!"
        
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to unlock locker (exit code: $LASTEXITCODE)"
        }
        
        Write-Output "✓ Unlock command passed"
    
    - name: Test - Verify Files Intact
      id: test-verify-files
      continue-on-error: true
      run: |
        Write-Output "Verifying files are intact after unlock..."
        $testDir = Get-Content "test-locker-path.txt" -ErrorAction SilentlyContinue
        if (-not $testDir) {
          Write-Output "⚠ Cannot verify files - locker path not found"
          exit 1
        }
        
        $content1 = Get-Content "$testDir\file1.txt" -Raw
        $content2 = Get-Content "$testDir\file2.txt" -Raw
        $content3 = Get-Content "$testDir\subfolder\file3.txt" -Raw
        
        if ($content1 -notmatch "Secret Content 1") {
          throw "File1 content was corrupted"
        }
        if ($content2 -notmatch "Secret Content 2") {
          throw "File2 content was corrupted"
        }
        if ($content3 -notmatch "Secret Content 3") {
          throw "File3 content was corrupted"
        }
        
        Write-Output "✓ All files intact after lock/unlock cycle"
    
    - name: Test - Wrong Password
      id: test-wrong-password
      continue-on-error: true
      run: |
        Write-Output "Testing lock with wrong password (should fail)..."
        & ".\cli-publish\cdlocker.exe" lock E2ETestLocker --password "WrongPassword123!" 2>&1 | Out-Null
        $exitCode = $LASTEXITCODE
        
        if ($exitCode -eq 0) {
          throw "Lock succeeded with wrong password - this should have failed!"
        }
        
        Write-Output "✓ Wrong password correctly rejected (exit code: $exitCode)"
        exit 0  # Reset exit code so GitHub Actions doesn't fail
    
    - name: Test - Remove Locker
      id: test-remove
      continue-on-error: true
      run: |
        Write-Output "Testing remove command..."
        Write-Output "Command: remove E2ETestLocker --force"
        $output = & ".\cli-publish\cdlocker.exe" remove E2ETestLocker --force
        Write-Output "Remove output: $output"
        Write-Output "Exit code: $LASTEXITCODE"
        
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to remove locker (exit code: $LASTEXITCODE)"
        }
        
        Write-Output "✓ Remove command passed"
    
    - name: Test - Verify Removal
      id: test-verify-removal
      continue-on-error: true
      run: |
        Write-Output "Verifying locker was removed..."
        $output = & ".\cli-publish\cdlocker.exe" list
        $outputText = $output -join "`n"
        Write-Output "Output: $output"
        
        if ($outputText -match "E2ETestLocker") {
          throw "Locker still appears in list after removal"
        }
        Write-Output "✓ Locker successfully removed"
    
    - name: Cleanup Test Directory
      if: always()
      run: |
        if (Test-Path "test-locker-path.txt") {
          $testDir = Get-Content "test-locker-path.txt"
          if (Test-Path $testDir) {
            Remove-Item -Path $testDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Output "Cleaned up test directory: $testDir"
          }
        }
    
    - name: E2E Test Summary
      if: always()
      run: |
        Write-Output ""
        Write-Output "═══════════════════════════════════════════════════════"
        Write-Output "           CLI End-to-End Test Results"
        Write-Output "═══════════════════════════════════════════════════════"
        Write-Output ""
        
        $tests = @(
          @{Name="Version Command"; Result="${{ steps.test-version.outcome }}"},
          @{Name="Help Command"; Result="${{ steps.test-help.outcome }}"},
          @{Name="List Empty Lockers"; Result="${{ steps.test-list-empty.outcome }}"},
          @{Name="Create Locker"; Result="${{ steps.test-create-locker.outcome }}"},
          @{Name="Create Test Files"; Result="${{ steps.test-create-files.outcome }}"},
          @{Name="List Lockers"; Result="${{ steps.test-list-lockers.outcome }}"},
          @{Name="Lock Locker"; Result="${{ steps.test-lock.outcome }}"},
          @{Name="Verify Locked"; Result="${{ steps.test-verify-locked.outcome }}"},
          @{Name="Unlock Locker"; Result="${{ steps.test-unlock.outcome }}"},
          @{Name="Verify Files Intact"; Result="${{ steps.test-verify-files.outcome }}"},
          @{Name="Wrong Password Validation"; Result="${{ steps.test-wrong-password.outcome }}"},
          @{Name="Remove Locker"; Result="${{ steps.test-remove.outcome }}"},
          @{Name="Verify Removal"; Result="${{ steps.test-verify-removal.outcome }}"}
        )
        
        $passed = 0
        $failed = 0
        $skipped = 0
        
        foreach ($test in $tests) {
          $icon = switch ($test.Result) {
            "success" { $passed++; "✓" }
            "failure" { $failed++; "✗" }
            "skipped" { $skipped++; "⊘" }
            default { "?" }
          }
          Write-Output "  $icon $($test.Name): $($test.Result)"
        }
        
        Write-Output ""
        Write-Output "Summary: $passed passed, $failed failed, $skipped skipped"
        Write-Output ""
        
        if ($failed -gt 0) {
          exit 1
        }

  test-summary:
    name: Test Summary
    runs-on: windows-latest
    needs: [unit-tests, cli-e2e-tests]
    if: always()
    
    steps:
    - name: Overall Summary
      run: |
        Write-Output ""
        Write-Output "╔════════════════════════════════════════╗"
        Write-Output "║      ColDog Locker - Test Summary      ║"
        Write-Output "╚════════════════════════════════════════╝"
        Write-Output ""
        
        $unitResult = "${{ needs.unit-tests.result }}"
        $e2eResult = "${{ needs.cli-e2e-tests.result }}"
        
        $unitIcon = if ($unitResult -eq "success") { "✓" } else { "✗" }
        $e2eIcon = if ($e2eResult -eq "success") { "✓" } else { "✗" }
        
        Write-Output "Unit Tests:        $unitIcon $unitResult"
        Write-Output "CLI E2E Tests:     $e2eIcon $e2eResult"
        Write-Output ""
        
        if ($unitResult -eq "success" -and $e2eResult -eq "success") {
          Write-Output "✓ All tests passed!"
          exit 0
        } else {
          Write-Output "✗ Some tests failed"
          exit 1
        }
