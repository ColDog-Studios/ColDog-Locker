name: Auto Merge Back

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to merge from'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - test
  pull_request:
    types: [closed]
    branches:
      - main
      - test

jobs:
  merge-back:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main back to test and dev
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.source_branch == 'main') || github.base_ref == 'main'
        run: |
          git fetch origin
          
          # Merge main to test
          git checkout test
          git merge origin/main -m "Auto-merge main back to test"
          git push origin test
          
          # Merge test to dev (cascade from test, not main)
          git checkout dev
          git merge origin/test -m "Auto-merge test back to dev"
          git push origin dev

      - name: Merge test back to dev
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.source_branch == 'test') || github.base_ref == 'test'
        run: |
          git fetch origin
          git checkout dev
          git merge origin/test -m "Auto-merge test back to dev"
          git push origin dev

      - name: Handle merge conflicts
        if: failure()
        run: |
          echo "::warning::Automatic merge failed due to conflicts. Manual intervention required."
          exit 1
