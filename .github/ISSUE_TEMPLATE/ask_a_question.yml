name: Ask a Question
description: Ask a Question
title: "[Question]: "
labels: ["type: question"]
body:
    - type: markdown
      attributes:
          value: |
              > Thanks for asking a question!
    - type: input
      id: contact
      attributes:
          label: Contact Details
          description: How can we get in touch with you if we need more info?
          placeholder: ex. email@example.com
      validations:
          required: false
    - type: textarea
      id: what-happened
      attributes:
          label: What is your Question?
          placeholder: What is your Question?
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: Version
          description: Paste the version shown by cdlocker --version or Help > About.
          placeholder: "1.0.0-beta+123.abcd123 (or source commit)"
      validations:
          required: false
    - type: dropdown
      id: OS
      attributes:
          label: OS
          description: What OS are you using?
          options:
              - Arch Linux
              - CentOS/RHEL
              - Debian
              - Fedora
              - Ubuntu
              - macOS
              - Windows 11
              - Windows Server
              - Other (put OS in description)
      validations:
          required: false
